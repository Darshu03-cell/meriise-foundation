    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

      :root {
        --bg: #05070c;
        --panel: #111827;
        --accent: #01adfc;
        --warm: #f3a65a;
        --text: #f8fbff;
        --muted: #a9b5c4;
        --line: rgba(255, 255, 255, 0.11);
        --card: rgba(17, 24, 39, 0.72);
        --body-gradient: linear-gradient(180deg, #070b16 0%, #05070c 100%);
        --topbar: rgba(0, 0, 0, 0.9);
        --soft-text: #d7e4f5;
        --modal: #0b1221;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'DM Sans', sans-serif;
        background: var(--body-gradient);
        color: var(--text);
        transition: background 0.2s ease, color 0.2s ease;
      }

      body.light-theme {
        --bg: #f4f8fc;
        --panel: #ffffff;
        --text: #172235;
        --muted: #526174;
        --line: rgba(23, 34, 53, 0.13);
        --card: rgba(255, 255, 255, 0.78);
        --body-gradient: linear-gradient(180deg, #f8fbff 0%, #e8f0f8 100%);
        --topbar: rgba(255, 255, 255, 0.94);
        --soft-text: #334155;
        --modal: #ffffff;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--topbar);
        padding: 0.8rem 1.2rem;
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: max-content;
      }

      .logo {
        width: 148px;
        max-height: 58px;
        object-fit: contain;
      }

      .brand-copy {
        border-left: 1px solid var(--line);
        padding-left: 0.75rem;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        line-height: 1.35;
        text-transform: uppercase;
      }

      .nav {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .nav a {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.78rem;
        font-weight: 600;
        transition: color 0.18s ease;
      }

      .nav a:hover {
        color: var(--text);
      }

      .theme-toggle {
        border: 1px solid rgba(1, 173, 252, 0.55);
        border-radius: 8px;
        padding: 0.55rem 0.8rem;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .theme-toggle:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .container {
        width: min(1200px, calc(100% - 2rem));
        margin: 0 auto;
      }

      .hero-banner {
        margin: 1rem 0 1.5rem;
        padding: clamp(1.4rem, 4vw, 3rem);
        border-radius: 12px;
        background: linear-gradient(135deg, #111827 0%, #07111f 70%, #0b3043 100%);
        border: 1px solid rgba(1, 173, 252, 0.35);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
        position: relative;
        overflow: hidden;
      }

      .hero-banner::after {
        content: '';
        position: absolute;
        right: 7%;
        top: -5rem;
        width: 15rem;
        height: 15rem;
        border: 1px solid rgba(1, 173, 252, 0.22);
        border-radius: 50%;
        box-shadow: 0 0 0 2rem rgba(1, 173, 252, 0.04), 0 0 0 4rem rgba(1, 173, 252, 0.025);
        pointer-events: none;
      }

      .hero-banner h2 {
        margin: 0;
        color: white;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(2rem, 4vw, 3.5rem);
        letter-spacing: -0.02em;
        position: relative;
        z-index: 1;
      }

      .hero-eyebrow {
        margin: 0 0 0.8rem;
        color: var(--warm) !important;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .hero-banner p {
        margin: 0.8rem 0 0;
        color: #d4e7fb;
        max-width: 780px;
        line-height: 1.7;
        position: relative;
        z-index: 1;
      }

      .hero {
        padding: clamp(3.5rem, 9vw, 7rem) 0 2.5rem;
        max-width: 820px;
      }

      .hero h1 {
        margin: 0;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(2.8rem, 7vw, 5.8rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
        color: var(--text);
      }

      .hero p {
        max-width: 760px;
        margin: 1.4rem 0 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .hero::before {
        content: 'ME-RIISE FOUNDATION / EVENT ARCHIVE';
        display: block;
        margin-bottom: 1rem;
        color: var(--warm);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .year-grid {
        margin: 1rem 0 1.5rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.7rem;
      }

      .year-card {
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        padding: 0.9rem 1rem;
        min-height: 96px;
        border-radius: 10px;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        text-align: left;
      }

      .year-card:hover,
      .year-card.active {
        transform: translateY(-3px);
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(1, 173, 252, 0.35), 0 14px 30px rgba(1, 173, 252, 0.15);
      }

      .year-card .year-label {
        display: block;
        color: var(--accent);
        font-size: 1.2rem;
        font-weight: 700;
      }

      .year-card .year-meta {
        display: block;
        color: var(--muted);
        margin-top: 0.4rem;
        font-size: 0.9rem;
      }

      .year-card.active .year-label {
        color: var(--warm);
      }

      .detail-panel {
        margin: 1.4rem 0 3rem;
        background: transparent;
        border-top: 1px solid var(--line);
        padding: 1.8rem 0 1.2rem;
      }

      .detail-panel h2 {
        margin-top: 0;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        color: var(--accent);
      }

      .detail-panel p {
        color: var(--soft-text);
        line-height: 1.8;
      }

      .event-list {
        display: grid;
        gap: 0.85rem;
        margin-top: 1rem;
      }

      .event-item {
        border-left: 3px solid var(--accent);
        padding: 0.8rem 1rem;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
      }

      .event-item strong {
        display: block;
        margin-bottom: 0.2rem;
      }

      .year-event-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1.25rem;
        margin-top: 1rem;
        cursor: pointer;
        transition: transform 0.18s ease, border-color 0.18s ease;
        animation: card-in 0.45s ease both;
      }

      .year-event-card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
      }

      .year-event-card h3 {
        color: var(--accent);
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
      }

      .year-event-card .date {
        color: var(--warm);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        margin-bottom: 0.7rem;
        display: inline-block;
      }

      .year-event-card .preview {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.5rem;
        margin-top: 0.8rem;
      }

      .year-event-card .preview img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border-radius: 10px;
      }

      .gallery {
        margin: 1rem 0 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.9rem;
      }

      .gallery img {
        width: 100%;
        height: 260px;
        object-fit: contain;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #05070c;
      }

      @keyframes card-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      :focus-visible {
        outline: 3px solid var(--warm);
        outline-offset: 3px;
      }

      .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
        padding: 1rem;
        z-index: 50;
      }

      .modal.open {
        display: flex;
      }

      .modal-card {
        width: min(980px, 100%);
        max-height: 92vh;
        overflow: auto;
        background: var(--modal);
        color: var(--text);
        border-radius: 18px;
        border: 1px solid rgba(1, 173, 252, 0.35);
        padding: 1.25rem;
      }

      .modal-card h3 {
        margin-top: 0;
        color: var(--accent);
      }

      .modal-close {
        margin-top: 0.8rem;
        padding: 0.7rem 1rem;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #062033;
        cursor: pointer;
        font-weight: 700;
      }

      .modal-card .gallery img {
        height: 320px;
      }

      @media (max-width: 640px) {
        .topbar {
          gap: 0.75rem;
          padding: 0.65rem 0.8rem;
        }

        .brand-copy {
          display: none;
        }

        .logo {
          width: 124px;
        }

        .nav {
          display: none;
        }

        .gallery {
          grid-template-columns: 1fr;
        }

        .modal-card .gallery img {
          height: 230px;
        }
      }
    </style>
  </head>

      const yearGrid = document.getElementById('yearGrid');
      const detailPanel = document.getElementById('detailPanel');
      const heroBanner = document.getElementById('heroBanner');
      const modal = document.getElementById('eventModal');
      const modalCard = modal.querySelector('.modal-card');
      const themeToggle = document.getElementById('themeToggle');
      const years = Object.keys(eventData).sort((a, b) => Number(b) - Number(a));

      function updateThemeToggle() {
        const isLight = document.body.classList.contains('light-theme');
        themeToggle.textContent = isLight ? 'Dark mode' : 'Light mode';
        themeToggle.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
      }

      themeToggle.addEventListener('click', () => {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('meriise-theme', isLight ? 'light' : 'dark');
        updateThemeToggle();
      });

      if (localStorage.getItem('meriise-theme') === 'light') {
        document.body.classList.add('light-theme');
      }
      updateThemeToggle();

      function renderGrid() {
        yearGrid.innerHTML = '';
        years.forEach((year) => {
          const card = document.createElement('button');
          card.className = 'year-card';
          card.type = 'button';
          card.innerHTML = `<span class="year-label">${year}</span><span class="year-meta">${eventData[year].title}</span>`;
          card.addEventListener('click', () => {
            document.querySelectorAll('.year-card').forEach((button) => button.classList.remove('active'));
            card.classList.add('active');
            renderDetails(year);
          });
          yearGrid.appendChild(card);
        });
      }

      function openEventModal(eventDataItem) {
        modalCard.innerHTML = `
          <h3>${eventDataItem.title}</h3>
          <div class="date">${eventDataItem.date}</div>
          <p>${eventDataItem.description}</p>
          <div class="gallery">
            ${eventDataItem.images.map((image) => `<img src="${image}" alt="${eventDataItem.title}" loading="lazy" />`).join('')}
          </div>
          <button class="modal-close" type="button">Close</button>
        `;
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        modal.querySelector('.modal-close').addEventListener('click', closeEventModal);
      }

      function closeEventModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
      }

      function renderDetails(year) {
        const data = eventData[year];
        heroBanner.innerHTML = `
          <p class="hero-eyebrow">Selected year / ${data.events.length} documented events</p>
          <h2>${year} Event Archive</h2>
          <p>${data.summary}</p>
        `;
        detailPanel.innerHTML = `
          <h2>${data.title}</h2>
          <p>${data.summary}</p>
          ${data.events.map((event) => `
            <article class="year-event-card" data-title="${event.title}">
              <h3>${event.title}</h3>
              <span class="date">${event.date}</span>
              <p>${event.description}</p>
              <div class="preview">
                ${event.images.slice(0, 3).map((image) => `<img src="${image}" alt="${event.title}" loading="lazy" />`).join('')}
              </div>
            </article>
          `).join('')}
        `;

        detailPanel.querySelectorAll('.year-event-card').forEach((card) => {
          card.addEventListener('click', () => {
            const selectedEvent = data.events.find((item) => item.title === card.dataset.title);
            if (selectedEvent) openEventModal(selectedEvent);
          });
        });
      }

      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          closeEventModal();
        }
      });

      renderGrid();
      renderDetails(2026);
      document.querySelector('.year-card').classList.add('active');
    </script>
